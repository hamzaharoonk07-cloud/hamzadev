<!doctype html>
<meta charset="utf-8">
<style>
  html,body{ margin:0; padding:0; width:1920px; height:1200px; overflow:hidden; background:#f1f0ee }
  .stage{ position:relative; width:1920px; height:1200px;
    background:#f1f0ee url(hero-base.svg) center center / cover no-repeat }
  .stage.reveal{ background-image:url(hero-reveal.svg); background-color:#ecebe9 }

  /* the photo is placed whole and centred, so every cover-crop keeps all of it */
  .frame{ position:absolute; left:50%; top:50%; width:580px; height:580px; transform:translate(-50%,-50%);
    border-radius:34px; overflow:hidden; box-shadow:0 40px 90px -30px rgba(17,17,17,.45), 0 0 0 1px rgba(17,17,17,.06) }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block;
    filter:grayscale(1) brightness(1.1) contrast(.95); opacity:.85 }
  .stage.reveal .frame img{ filter:saturate(1.05) contrast(1.04); opacity:1 }
  .stage.reveal .frame{ box-shadow:0 40px 90px -30px rgba(17,17,17,.5), 0 0 0 1px rgba(177,95,44,.25) }

  .wash{ position:absolute; inset:0;
    background:linear-gradient(to right, rgba(241,240,238,.92) 0%, rgba(241,240,238,.55) 20%, rgba(241,240,238,0) 33%) }
  .stage.reveal .wash{
    background:linear-gradient(to right, rgba(236,235,233,.88) 0%, rgba(236,235,233,.48) 20%, rgba(236,235,233,0) 33%) }
  .veil{ position:absolute; inset:0; background:rgba(241,240,238,.16) }
  .stage.reveal .veil{ background:transparent }
</style>
<div class="stage" id="stage">
  <div class="wash"></div>
  <div class="frame"><img src="profile.jpg" alt=""></div>
  <div class="veil"></div>
</div>
<script>
  if (location.search.indexOf('reveal') > -1) document.getElementById('stage').classList.add('reveal');
</script>
